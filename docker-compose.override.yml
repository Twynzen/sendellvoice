version: '3.8'

# Development overrides
# This file is automatically used when running docker-compose up
# without specifying -f flags

services:
  sendellvoice-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
    volumes:
      # Mount source for hot reload during development
      - ./src:/src:ro
      - ./models:/app/models
      - ./logs:/app/logs
    # Enable debugging
    ports:
      - "5000:8080"

  # Development-specific service for running without Docker
  # Just starts dependencies
  sqlserver:
    ports:
      - "1433:1433"

  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  ollama:
    ports:
      - "11434:11434"
