version: '3.8'

services:
  sendellvoice-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sendellvoice-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SendellVoice;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - Providers__LLM=Ollama
      - Providers__Speech=WhisperNet
      - Providers__VectorStore=Qdrant
      - Ollama__Endpoint=http://ollama:11434
      - Qdrant__Host=qdrant
      - Qdrant__Port=6334
    depends_on:
      sqlserver:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - sendellvoice-net
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sendellvoice-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sendellvoice-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sendellvoice-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - sendellvoice-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: sendellvoice-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - sendellvoice-net
    restart: unless-stopped
    # Uncomment below for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  sendellvoice-net:
    driver: bridge

volumes:
  sqlserver-data:
  qdrant-data:
  ollama-data:
